<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab Unit Converter</title>

    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#16a34a" />

    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lab Converter" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />

    <link href="./src/output.css" rel="stylesheet" />

    <meta name="description" content="Lab Unit Converter - Offline PWA for medical lab test conversions and interpretation" />

    <meta property="og:title" content="Lab Unit Converter" />
<meta property="og:description" content="Offline medical lab converter with interpretation and PWA support" />
<meta property="og:image" content="./screenshots/desktop.png" />
  </head>

  <body class="bg-green-100 flex items-center justify-center min-h-screen">

    <!-- Install Button -->
    <button
      id="installBtn"
      aria-label="Install Lab Unit Converter app"
      class="fixed top-4 right-4 bg-green-600 text-white px-4 py-2 rounded shadow-lg hover:bg-green-700 transition-all duration-300 ease-in-out opacity-0 pointer-events-none focus:outline-none focus:ring-2 focus:ring-green-300 focus:ring-offset-2"
    >
      <span class="text-sm font-semibold block">Install App</span>
      <span class="text-xs opacity-80 block">Faster • Offline • No UI</span>
    </button>

    <!-- App Card -->
    <div class="bg-white p-8 rounded-2xl shadow-lg w-96">
      <h1 class="text-xl font-bold mb-4 text-center">Lab Unit Converter</h1>

      <!-- Test -->
      <label class="block mb-2 font-medium">Test</label>
      <select id="test" class="w-full p-2 border rounded mb-4">
        <option value="phosphate">Phosphate</option>
        <option value="magnesium">Magnesium</option>
        <option value="uric_acid">Uric Acid</option>
        <option value="chol_hdl_ratio">Chol/HDL Ratio</option>
      </select>

      <!-- Value -->
      <label class="block mb-2 font-medium">Value</label>

      <div class="flex gap-2 mb-4">
        <input
          type="number"
          id="value"
          class="w-full p-2 border rounded"
          placeholder="Enter Value"
        />

        <button
          id="clearValue"
          class="px-3 py-2 bg-red-500 text-white rounded hover:bg-red-600"
          type="button"
        >
          Clear
        </button>
      </div>

      <!-- Cholesterol Inputs -->
      <div id="cholesterolInputs" class="hidden mb-4">
        <label class="block mb-2 font-medium">Total Cholesterol</label>
        <input type="number" id="totalChol" class="w-full p-2 border rounded mb-2" />

        <label class="block mb-2 font-medium">HDL Cholesterol</label>
        <input type="number" id="hdl" class="w-full p-2 border rounded" />
      </div>

      <!-- Unit -->
      <label class="block mb-2 font-medium">From Unit</label>
      <select id="unit" class="w-full border p-2 rounded mb-4"></select>

      <!-- Result -->
      <div id="result" class="mt-4 text-center text-lg font-semibold"></div>
    </div>

    <script type="module" src="js/script.js"></script>
  </body>
</html>
